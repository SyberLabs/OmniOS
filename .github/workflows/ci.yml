name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium is required by agent-surface Vitest (live disposable tabs)
      # and by the golden-path Playwright e2e later in this job.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Blocking gates — these protect the green build (Phase 1) and the
      # test suite (Phase 4).
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Blocking as of Phase 5: lint errors = 0. ESLint exits non-zero only on
      # errors, so this fails CI on new errors while pre-existing warnings
      # (no-explicit-any, unused vars, react-hooks correctness) stay advisory.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Golden-path e2e (apex A3): drives the real built app — spawn Investor
      # shell → blocks render → wires live → mock-LLM Think streams → persists
      # across reload. The LLM is the OMNI_E2E server double (no keys needed).
      # This guards the UI wiring layer where unit tests can't see.
      - name: E2E (golden path)
        run: npm run test:e2e
